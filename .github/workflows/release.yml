name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish CLI (win-x64, single file)
        run: dotnet publish src/WinTuner.Cli --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output dist/cli

      - name: Publish GUI (win-x64, single file)
        run: dotnet publish src/WinTuner.Gui --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output dist/gui

      - name: Collect artifacts and generate checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/assets | Out-Null
          # Rename to unambiguous asset names (wintuner.exe vs WinTuner.exe collide on Windows).
          Copy-Item dist/cli/wintuner.exe dist/assets/WinTuner-cli-win-x64.exe
          Copy-Item dist/gui/WinTuner.exe  dist/assets/WinTuner-gui-win-x64.exe

          $lines = Get-ChildItem dist/assets -Filter *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            '{0}  {1}' -f $hash, $_.Name
          }
          $lines | Set-Content -Encoding ascii dist/assets/SHA256SUMS.txt
          Get-Content dist/assets/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/assets/WinTuner-cli-win-x64.exe `
            dist/assets/WinTuner-gui-win-x64.exe `
            dist/assets/SHA256SUMS.txt `
            --title "${{ github.ref_name }}" `
            --generate-notes
